name: 部署 Echoes Studio

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: production
    secrets:
      DEPLOY_TOKEN:
        required: true
      DATABASE_URL:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: 部署环境
        required: true
        type: choice
        default: production
        options: [production, preview]

permissions:
  contents: read

concurrency:
  group: echoes-studio-deploy-${{ github.repository }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'push' || vars.DEPLOY_CONFIG != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 读取部署配置
        id: config
        run: node deploy/resolve-config.mjs
      - run: pnpm check

      - name: 检查平台和数据库配置
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_TOKEN" ]] || { echo '缺少 GitHub Secret：DEPLOY_TOKEN' >&2; exit 1; }

          case "$DATABASE_DRIVER" in
            supabase|postgres)
              [[ -n "$DATABASE_URL" ]] || { echo 'PostgreSQL/Supabase 需要 GitHub Secret：DATABASE_URL' >&2; exit 1; }
              ;;
            d1)
              ;;
            *) echo "不支持的数据库驱动：$DATABASE_DRIVER" >&2; exit 2 ;;
          esac

      - name: 迁移 PostgreSQL / Supabase
        if: steps.config.outputs.database == 'supabase' || steps.config.outputs.database == 'postgres'
        env:
          CMS_DATABASE_DRIVER: ${{ steps.config.outputs.database }}
          CMS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CMS_DATABASE_MIGRATE: "true"
        run: pnpm db:migrate

      - name: 准备 Cloudflare 数据库和部署配置
        if: steps.config.outputs.platform == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: node deploy/cloudflare/prepare.mjs

      - name: 迁移 D1
        if: steps.config.outputs.platform == 'cloudflare' && steps.config.outputs.database == 'd1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: npx --yes wrangler@4.114.0 d1 migrations apply "$CMS_PROJECT_NAME" --remote --config .output/wrangler.toml

      - name: 部署 Cloudflare 后端
        if: steps.config.outputs.platform == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: npx --yes wrangler@4.114.0 deploy --config .output/wrangler.toml

      - name: 配置数据库并部署 Vercel 后端
        if: steps.config.outputs.platform == 'vercel'
        env:
          DEPLOY_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          set -euo pipefail
          scope_args=()
          if [[ -n "$VERCEL_SCOPE" ]]; then
            scope_args+=(--scope "$VERCEL_SCOPE")
          fi

          node deploy/vercel/prepare.mjs
          npx --yes vercel@56.5.0 link --yes --project "$CMS_PROJECT_NAME" --token "$DEPLOY_TOKEN" "${scope_args[@]}"

          deploy_args=(deploy --prebuilt --yes --token "$DEPLOY_TOKEN")
          deploy_args+=(--env "CMS_DATABASE_DRIVER=$DATABASE_DRIVER")
          deploy_args+=(--env "CMS_DATABASE_URL=$DATABASE_URL")
          deploy_args+=(--env "CMS_DATABASE_MIGRATE=false")
          if [[ "$DEPLOY_ENV" == "production" ]]; then
            deploy_args+=(--prod)
          fi
          npx --yes vercel@56.5.0 "${deploy_args[@]}" "${scope_args[@]}"

      - name: 配置数据库并部署 EdgeOne 后端
        if: steps.config.outputs.platform == 'edgeone'
        env:
          DEPLOY_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          set -euo pipefail
          node deploy/edgeone/prepare.mjs
          cd .output/edgeone-bundle
          for attempt in 1 2 3; do
            if npx --yes edgeone@1.6.18 makers deploy . \
              -n "$CMS_PROJECT_NAME" -t "$DEPLOY_TOKEN" -e "$DEPLOY_ENV" \
              --area "$CMS_EDGEONE_AREA"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo 'EdgeOne 连续三次部署失败。' >&2
              exit 1
            fi
            echo "EdgeOne API 暂时不可用，准备第 $((attempt + 1)) 次尝试。"
            sleep $((attempt * 10))
          done
